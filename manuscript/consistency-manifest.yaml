# AVE Postdiction Manifest — reproductions against already-known values
#
# Structured claim graph for Tier-2 rigor. Every row of the public README and
# LIVING_REFERENCE Master Prediction Table maps to an entry in EITHER this file
# or manuscript/predictions.yaml; the validator's parity checks read the UNION.
#
# SCOPE (split 2026-08-13, Grant: "the predictions yaml should be forward only,
# we should make a postdiction yaml"). This file holds claims REPRODUCED against
# a value that was already known -- what README.md:41 calls the "45
# consistency-class entries". Forward predictions -- untested by construction --
# live in manuscript/predictions.yaml. The 47<->36 accounting ratified at
# _orchestration/2026-07_repo-conventions.md sec.(f) is preserved here: all 36
# entries moved wholesale and unedited, so the disposition table still resolves.
#
# The split does NOT key on `calibration_role`: Grant ruled 2026-08-05 that that
# axis is value-provenance and "orthogonal to `type`". Membership is by FILE.
# Entries link back to:
#   - manuscript labels (\label{} targets) where the derivation lives
#   - constants.py symbols that carry the predicted numeric value
#   - observed values with their source
#
# src/scripts/predictions_manifest_validator.py verifies (8 checks; the script was
# renamed from claim_graph_validator.py and this header lagged it):
#   1. schema      — required fields, allowed `type`, id shape, no duplicate ids
#   2. label       — derivation_label resolves to a \label{} in manuscript/**/*.tex
#   3. engine      — constants_py_symbol resolves and matches predicted_value (rtol 1e-5)
#   4. bridge      — every entry bridges into the KB claim DAG via clm:/exp: (INVARIANT-S11)
#   5. axioms      — axioms_used equals the recomputed transitive axiom cone of the bridge
#   6. calibration_role — declared role reconciled against the bridged claim card's prose
#                    (GATING at severity=critical since 2026-08-05)
#   7. parity      — every README table row maps to an entry in EITHER manifest
#   8. lr_parity   — same for LIVING_REFERENCE
#
# ─── Entry schema ────────────────────────────────────────────────────────────
# id:                    stable identifier (P01, P02, ...) — never re-use
# name:                  short human-readable name
# type:                  classification (A1 rule, mirrors `consistency-vs-emergence` skill v1.1)
#                          derived_prediction        — genuine forward prediction (Class D)
#                          axiom_manifestation       — axiom expressed at a new scale (Class B)
#                          identity                  — definitional; 0% is trivially true (Class A)
#                          consistency_check         — reproduces a known result (Class C)
#                          operating_point_projection — Class E: observable is one of N projections
#                                                       of a single substrate operating-point;
#                                                       N observables joint-constrained, failure of
#                                                       any one falsifies the operating-point
#                          engineering_limit         — theoretical bound
# calibration_role:    (optional) value-provenance axis, orthogonal to `type`:
#                        chord  — a FORM/ratio/selection-rule AVE genuinely forces
#                        echo   — dimensionful VALUE imported/calibrated (rides {m_e,α,G})
#                        mixed  — form-derived but value rides echoes ± a fitted scalar
#                        fitted — magnitude tuned per-system to match
#                        consistency — reproduces a known result / definitional residual
#                        forward-prediction — untested, divergent-from-SM, AVE-distinct
# derivation_label:      \label{} target in manuscript/**/*.tex
# constants_py_symbol:   (optional) name in src/ave/core/constants.py
# predicted_value:       (optional) numeric value for validator to cross-check
# predicted_unit:        (optional) unit annotation
# observed_value:        (optional) measured value
# observed_source:       (optional) e.g. "CODATA 2022", "PDG 2022"
# error_percent:         (optional) |pred - obs| / obs × 100
# axioms_used:           list of axiom numbers (1-4) the derivation depends on
# public_in_readme:      true if appears in README master table
# public_in_living_ref:  true if appears in LIVING_REFERENCE master table
# notes:                 free-form explanation
# ────────────────────────────────────────────────────────────────────────────

