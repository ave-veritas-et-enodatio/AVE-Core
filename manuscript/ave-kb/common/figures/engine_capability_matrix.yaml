# Cell status vocabulary:
#   have    — the engine carries this DOF, validated.
#   partial — present but incomplete / not emergent / proxy-only.
#   absent  — structurally missing on this engine (often a firewall consequence).
#   na      — not applicable (the DOF is out of this engine's domain, e.g. spatial cage in a circuit model).
