    partial = present but incomplete/non-emergent; absent = structurally missing (firewall);
    na = out of the engine's domain.

# The 7 DOF a complete electron needs SIMULTANEOUSLY, and why.
dof:
  - key: a1_cage
    name: "A1 mass-cage (stiffening c_eff->inf)"
    why: "rest mass = self-trapped LONGITUDINAL-bulk wall; c_eff->inf at the saturated core self-creates the Gamma=-1 TIR cage"
  - key: winding
    name: "Cosserat winding (charge)"
    why: "charge = the (2,3) Beltrami micro-rotation helicity the cage must carry"
  - key: three_channel
    name: "3-channel coupling (EM/shear/bulk)"
    why: "the electron lives across all three impedance channels; a complete engine must carry & couple them"
  - key: loop
    name: "constitutive loop (remanence)"
    why: "mass persists at zero drive (ferrite B_r analogue); the canonical kernel is anhysteretic, so this is the open R10 gap"
  - key: boost
    name: "boost-covariance (motion)"
    why: "a moving electron must Lorentz-transform; transport/boost is absent from every engine"
  - key: chiral_grid
    name: "chiral grid (srs handedness)"
    why: "structural parity is set by the I4_1 32 srs grid; a cubic grid is achiral and cannot carry it"
  - key: node_creation
    name: "node-creation (genesis)"
    why: "pair production / lattice node birth; no engine hosts it (cosmological front)"

