# Round 2 = research/l3-electron-soliton..analysis/integration delta -> migrate-l3-to-blr.

meta:
  purpose: >-
    Pins each L3-author content change between rounds (scope: common + vol1)
    to its BLR target path. Drives the port -> rescore -> refresh phases for
    round 2. Companion to round2-claim-triage.md (which carries claim-graph
    dispositions per leaf: stay/rehome/split/drop and the resolved adjudications).
  ancestor: 317faf3              # tip of research/l3-electron-soliton; round-1 source = round-2 base
  l3_source: "analysis/integration @ c7996256"  # re-pinned 2026-05-20 from c5b725c; delta = 3 in-scope files, 5+/5- (closure-roadmap, divergence-test-substrate-map, universal-saturation-kernel-catalog)
  blr_target_branch: "migrate-l3-to-blr @ d66df11e"
  kb_root: "manuscript/ave-kb/"  # every l3_path is relative to this
  blr_target_rule: >-
    BLR target path == l3_path for every row. No renames/copies/deletes in the
    L3 round-2 delta (all 29 entries are M or A, zero D).
  scope: [common, vol1]
  delta_command: >-
    git -C ../AVE-Core_L3 diff research/l3-electron-soliton..analysis/integration --
    manuscript/ave-kb/common/ manuscript/ave-kb/vol1/
  generated: 2026-05-20
  companion: "round2-claim-triage.md -- per-leaf claim-graph triage (stay/rehome/split/drop dispositions)"

coverage:
  l3_changed_files: 29           # 22 M + 7 A in common+vol1
  rows: 29
  new_leaf: 7                    # 6 common + 1 vol1
  modified_leaf: 17              # M minus 4 indexes minus 1 park
  index_nav: 4                   # common/index, common/translation-tables/index, vol1/dynamics/ch4/index, vol1/index
  park: 1                        # common/closure-roadmap.md (parked verbatim per task #9 convention)
  axiom_homologation: 0          # unchanged in L3 round-2 delta; already at session/l3-migration/ from earlier copy
  gate_pinned: "rows == l3_changed_files (29)"
  gate_ported: "all 29 rows status >= ported"

legend:
  disposition:
    new-leaf:      "absent from BLR -- author new leaf in new-KB format; mint clm-id(s) OR no-claim"
    modified-leaf: "exists in BLR -- semantic 3-way merge of L3 delta onto BLR leaf; convert <!-- leaf: verbatim --> to S5 kb-frontmatter"
    index-nav:     "index.md -- re-do nav additions in new-KB index format; subtree-claims auto-regenerates via refresh"
    park:          "not a KB leaf (process/planning/spec doc) -- copy verbatim to session/l3-migration/ per task #9"
  status: "pinned -> enriched -> ported -> rescored -> refreshed"
  delta_class:
    framing-only:            "framing/scope shift; no new physics content"
    new-content:             "new sections / new rows / new tables"
    numeric-correction:      "a derivation value or coefficient corrected (carries audit note)"
    mechanism-replacement:   "load-bearing mechanism replaced (e.g. bullet-cluster TT-shockwave -> ponderomotive halo)"
    scope-correction:        "claim's locus of applicability narrowed/widened with explicit audit"
    claim-shape-change:      "claims: list or inline markers materially affected (see triage_ref)"
    cross-ref-add:           "primarily new cross-references (e.g. to new round-2 leaves)"
  triage_ref: "section anchor in round2-claim-triage.md; see that file for per-claim disposition + rationale"

method_notes:
  - >-
    Round-2 deltas are mostly leaf-local refinements; NO structural changes
    (CLAUDE.md untouched, no axiom restructure, zero deletions). 21 of 29 are
    refinements to existing leaves; 7 are new content; 1 is parked.
  - >-
    L3 systematically strips our claim-graph machinery (claims: frontmatter
    + inline <!-- claim-quality: --> markers) because L3 uses a different leaf
    convention (<!-- leaf: verbatim --><!-- path-stable: ... -->). This is
    CONVENTION ONLY -- not a retirement signal. Default disposition per claim
    is STAY (re-apply our machinery atop L3's prose). See round2-claim-triage.md
    for the 4 exceptions: clm-gr8d63 rehome, clm-hvvvop split, clm-dxdsvt
    title update (21->26 instances), clm-m3z5ux on bullet-cluster needs-assessment.
  - >-
    Time/clarity heuristic for ambiguities (per working principle 2026-05-20
    02:56): later canonicalized statement wins; silent regressions lose to
    explicit qualifications. 4 adjudications resolved in round2-claim-triage.md
    (G framing, MOND class, c_eff sign, Hoop Stress motif home); 1 deferred
    (omega-freeze "Provisional" guardrail drop -- need brief git log check
    at port time).
  - >-
    6 RIGOR REGRESSIONS in L3 to NOT port (preserve current text per clarity
    heuristic): omega-freeze "Provisional" guardrails, xi-topo delta_strain
    qualifier, four-regimes sector-dependence note + Ch.3 sidebar, operators.md
    §2 LaTeX->unicode notation, full-derivation-chain methodology disclosure
    callout, vol1/index.md "G from Axiom 3" framing. See round2-claim-triage.md.
  - >-
    171 L3 commits in delta range. Per-commit provenance available via
    delta_command; not enumerated inline. Key audit threads to watch on port:
    Class-E operating-point projection (Grant canonized 2026-05-19 EOD),
    Chain B' showstoppers (2026-05-19), G_vac 13-OOM correction (92d904f),
    bullet-cluster mechanism replacement (d953ccf), Hoop Stress 2π motif
    walk-back to 2 instances (f9e707f), DAMA 8th-9th-11th-12th audit cycles.
  - >-
    Port order: (1) 7 new leaves first (so cross-refs from the 17 modifieds
    resolve); (2) 17 modifieds in dependency order, ch4 cluster + A-034 cluster
    together; (3) 4 index-nav updates (auto-mostly via refresh); (4) parked
    closure-roadmap re-sync; (5) rescore newly-pending + lift candidates per
    triage; (6) refresh + verify.

