legend:
  disposition:
    new-leaf:      "absent from BLR -- author new leaf in new-KB format; mint clm-id(s) OR no-claim"
    modified-leaf: "exists in BLR -- semantic 3-way merge of L3 delta onto BLR leaf"
    index-nav:     "index.md -- re-do nav additions in new-KB index format; subtree-claims auto-regenerates via refresh"
    cosmetic:      "no claim-bearing change -- confirmed at enrichment"
    park:          "not a KB leaf at all (process/planning/spec doc) -- park outside ave-kb/ per Task #9"
  status: "pinned -> enriched -> ported -> rescored -> refreshed"
  clm_ids:
    "MINT xN":   "new-leaf -- N distinct claims to mint at port time; see claims:"
    "no-claim":  "new-leaf with no discrete claim -- port as kind: leaf with no-claim: (INVARIANT-S5)"
    "[clm-...]": "modified-leaf -- existing BLR claim(s) the leaf carries"
    "n/a":       "index node / parked doc"
  enrichment_fields:
    claims:      "new-leaf claim-bearing -- one line per distinct claim to mint"
    no_claim:    "new-leaf no-claim / cosmetic -- the reason"
    delta_class: "modified-leaf -- framing-only | new-content | claim-state-change | superseded (+ combos)"

method_notes:
  - "Port the NET delta (git diff ancestor..L3), NOT a commit replay -- the author walked claims back mid-arc (b254a71 -> 07ea7de; 15ce5e9 downgraded docs 117/118 closure claims)."
  - "Framing-sweep edits are resolved by framing-concordance.md: A (substrate noun -> dialect-bridge) ADOPT; B (axiom headers) NO-DELTA; C (electron -> 0_1 unknot) ADOPT; D (strip private-repo names) ADOPT."
