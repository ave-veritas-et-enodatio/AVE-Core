  - "CROSS-LEAF CLAIM OWNERSHIP: several claims appear in 2+ L3 leaves. At port time pick ONE canonical owner; the others cite (do not re-mint). See the per-row notes for: three-route (cosmic-parameter-horizon vs omega-freeze); p*=8pi-alpha (q-g47 vs two-engine); A1+T2 irrep (k4-port-irrep owns; photon-* cite); A-034 kernel (universal-saturation-kernel-catalog owns; full-derivation-chain + mathematical-closure cite)."
