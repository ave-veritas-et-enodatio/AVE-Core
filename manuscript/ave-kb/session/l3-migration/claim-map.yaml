  new_leaf_claim_bearing: 20
  new_leaf_no_claim: 3           # numerical-provenance-manifest, trampoline-analogy-primer, continuous-springs-reframing
  park: 2                        # closure-roadmap, axiom-homologation -- process/spec docs, NOT KB leaves
  modified_leaf: 12
  cosmetic: 1                    # appendix-spice-verification (reclassified at enrichment)
  index_nav: 7
  gate_pinned: "rows == l3_changed_files (45)"
