# L3 -> BLR KB Migration -- Claim Map Worksheet
# TRANSIENT reconciliation artifact. Delete after pass 2 (code) completes.

meta:
  purpose: >-
    Pins each L3-author KB content change (scope: common + vol1) to its BLR
    new-KB target claim-id(s). Drives the port -> rescore -> refresh phases.
    Not canonical; delete when the migration completes.
  ancestor: 05e2a45              # merge-base(migrate-l3-to-blr, research/l3-electron-soliton); == main tip
  l3_source: "research/l3-electron-soliton @ 317faf3 (clone ../AVE-Core_L3; git remote 'l3')"
  blr_target_branch: "migrate-l3-to-blr @ e49556b"
  kb_root: "manuscript/ave-kb/"  # every l3_path is relative to this
  blr_target_rule: >-
    BLR target path == l3_path for every row. The rework did 0 renames /
    0 copies / 0 deletes ave-kb-wide, so path IS the correspondence.
  scope: [common, vol1]
  delta_command: "git diff 05e2a45..l3/research/l3-electron-soliton -- manuscript/ave-kb/common/ manuscript/ave-kb/vol1/"
  generated: 2026-05-17

coverage:
  l3_changed_files: 45
  rows: 45
  new_leaf: 25
  modified_leaf: 13
  index_nav: 7
  gate: "rows == l3_changed_files (45); every row carries exactly one disposition"

legend:
  disposition:
    new-leaf:      "absent from BLR -- author new leaf in new-KB format, mint clm-id(s), new claim-quality entry"
    modified-leaf: "exists in BLR -- semantic 3-way merge of L3 delta onto BLR leaf"
    index-nav:     "index.md -- re-do nav additions in new-KB index format; subtree-claims auto-regenerates via refresh"
    cosmetic:      "no claim-bearing change -- assigned ONLY after confirmation at enrichment"
  status: "pinned -> enriched -> ported -> rescored -> refreshed"
  clm_ids:
    MINT:        "new claim-id(s) to be generated at port time"
    "[clm-...]": "existing BLR claim(s) the leaf carries (read from BLR frontmatter)"
    "n/a":       "index node -- carries derived subtree-claims, not authored claims"

method_notes:
  - "Port the NET delta (git diff ancestor..L3), NOT a commit replay -- the author walked claims back mid-arc (b254a71 -> 07ea7de; 15ce5e9 downgraded docs 117/118 closure claims)."
  - "A modified-leaf may ALSO need a MINT if L3 added a wholly new result to an existing leaf -- flag at enrichment."
  - "Framing-sweep edits (Trefoil-electron, Cosserat, substrate-native renames) must be diffed against the BLR target; BLR may already carry the framing. Port only genuine deltas."
  - "research/_archive/L3_electron_soliton/ is reference-only (author working notes), not a migration target -- revisit only if a crucial non-transitional result is found missing from the KB."

