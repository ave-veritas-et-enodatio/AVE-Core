name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # PR-blocking gate: physics verify (~1 min) + the bedrock keeper suite (~1830 unit
  # tests, engine-sims excluded by `make test`'s `-m "not engine_sim"`), parallelized
  # via pytest-xdist (`-n auto`). The serial suite had grown to ~30 min and was hitting
  # the timeout; parallel keeps it well under. This is the job to mark "required" in
  # branch protection. (CI partition: research/2026-06-13_ci-engine-sim-partition_prereg.md)
  validators:
    name: make verify + make test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: the lane number-check gates pin scan surfaces and read
          # blobs at historical SHAs (SCANFRAG-class pins); a shallow clone 128s
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: make verify
        run: make verify

      - name: make test
        run: make test

  # Cite-rot option (3): the NEW-cite excerpt ratchet. PR-only — it measures
  # what a branch ADDS against the merge base, so it is meaningless on a push
  # to main. Needs full history (fetch-depth: 0) for the merge-base diff.
  #
  # SEPARATE JOB, and keep it NON-required in branch protection until the
  # orchestrator flips it — same posture as the engine-sims job below, and for
  # the same reason: this is a workflow change with blast radius past the
  # checker itself. Back-tested over the last 25 merges to main, it would have
  # blocked 4 of the 20 PR merges (each adding 1-8 excerpt-less KB cites) — which
  # is the intended behaviour, not a defect, but it is the orchestrator's call
  # to make it blocking, not the implementer's.
  new-cite-excerpts:
    name: new-cite excerpt ratchet (non-required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history — merge-base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: make verify-new-cite-excerpts
        run: make verify-new-cite-excerpts CITE_BASE=origin/${{ github.base_ref }}

  # Opt-in lane: the slow tier-1/2 engine-simulation tests (`-m engine_sim`).
  # Runs on the same triggers so engine PRs get coverage feedback, but it is a
  # SEPARATE job — keep it NON-required in branch protection so its latency
  # never blocks PR merges or risks the gate timeout.
  engine-sims:
    name: make test-engine (opt-in)
    runs-on: ubuntu-latest
    # 120 (was 60): the serial engine_sim lane was overrunning the 60-min budget on
    # main itself (only ~55-65% complete at cancel), so the opt-in job never went
    # green. It is NON-required, so the extra latency blocks nothing. Serial-by-design
    # for OOM-safety; the per-test --timeout (Makefile) bounds any true hang.
    timeout-minutes: 200
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: make test-engine
        run: make test-engine
