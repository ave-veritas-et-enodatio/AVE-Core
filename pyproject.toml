[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ave"]

[project]
name = "ave"
version = "0.1.0"
description = "Mathematical Framework for Applied Vacuum Engineering (AVE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "jax>=0.10.1",
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "PySpice>=1.5",         # ngspice Python bindings (requires ngspice system install)
    "scikit-rf>=0.30.0",    # RF/microwave engineering (S-parameter validation)
]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
# Worktree-aware import resolution. `ave` is installed editable via a path
# .pth that pins it to the MAIN checkout's src/ (see _editable_impl_ave.pth),
# so without this every git worktree would import the main checkout's ave/*,
# not its own. `pythonpath` is resolved relative to pytest's rootdir (this
# file's dir == the current worktree) and inserted at sys.path[0], ahead of
# the .pth path — so pytest/`make test` exercise THIS tree's code. In the main
# checkout the two paths coincide, so behavior is unchanged.
pythonpath = ["src"]
# A bare `pytest` from a worktree root then collects the unit-test tree only
# (matches `make test`; honors src/tests/conftest.py collect_ignore_glob).
testpaths = ["src/tests"]
# CI partition (research/2026-06-13_ci-engine-sim-partition_prereg.md): slow,
# research-tier engine-simulation tests are marked `engine_sim` and routed to the
# opt-in `make test-engine` lane; default `make test` runs `-m "not engine_sim"`.
# Selection is by test cost/role ONLY — never by capability-matrix grade (§7 invariant).
markers = [
    "engine_sim: slow/research-tier engine-simulation test (tier-1 wiring or tier-2 driver); opt-in via `make test-engine`",
]
